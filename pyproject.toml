[project]
name = "mysql-restore"
version = "2026.11"
description = "Mysqldump GTID backups and direct-binlog Docker point-in-time recovery"
readme = "README.md"
authors = [
    { name = "i-curve", email = "i-curve@qq.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
mysql-restore = "mysql_restore:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
