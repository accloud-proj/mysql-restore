name: Build release binaries

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9]"
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag: yyyy.mm[.revision], e.g. 2026.11.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python3 scripts/package.py --version "$RELEASE_VERSION" --validate-only
          if git rev-parse --verify "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")" = "$GITHUB_SHA" || {
              echo "::error::The version tag already points to a different commit."
              exit 1
            }
          fi
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: ubuntu-22.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build
      - name: Run regression tests
        run: uv run python -m unittest discover -s tests
      - name: Build and smoke-test binary
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: uv run --group build python scripts/package.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: mysql-restore-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --target "$TARGET_COMMIT" \
              --title "$RELEASE_VERSION" --generate-notes
          fi
          gh release upload "$RELEASE_VERSION" release/* --clobber
